services:
  - type: web
    name: firmai
    runtime: python
    rootDir: .
    buildCommand: pip install -r fimai/requirements.txt
    startCommand: uvicorn fimai.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: REPLICATE_VIDEO_MODEL
        sync: false
