<head>

<style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#f5f7fb;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}.wrap{width:min(900px,100%)}.tag{color:#ff6544;font-weight:800;letter-spacing:.16em;font-size:12px}h1{font-size:clamp(32px,7vw,62px);line-height:.98;margin:14px 0}p{color:#b8c1d1;line-height:1.55}.stage{position:relative;overflow:hidden;border:1px solid #293449;border-radius:18px;background:linear-gradient(#111a2b 0 55%,#222d3d 55%);aspect-ratio:16/9;margin-top:22px}.moon{position:absolute;width:58px;height:58px;border-radius:50%;background:#e5e7eb;right:12%;top:12%;box-shadow:0 0 35px #dce8ff66}.city{position:absolute;bottom:35%;left:0;right:0;height:36%;background:linear-gradient(90deg,#0a0e18 0 8%,transparent 8% 10%,#0a0e18 10% 22%,transparent 22% 25%,#0a0e18 25% 38%,transparent 38% 41%,#0a0e18 41% 56%,transparent 56% 60%,#0a0e18 60% 74%,transparent 74% 78%,#0a0e18 78%);opacity:.9}.road{position:absolute;bottom:0;height:35%;width:100%;background:#171b24;border-top:5px solid #566071}.road:after{content:"";position:absolute;top:48%;left:0;width:200%;border-top:4px dashed #e6d7a1;animation:road 1.2s linear infinite}@keyframes road{to{transform:translateX(-50%)}}.runner{position:absolute;bottom:23%;left:15%;font-size:clamp(45px,9vw,82px);animation:run 2.7s ease-in-out infinite;filter:drop-shadow(0 6px 4px #0008)}.copcar{position:absolute;bottom:16%;left:-30%;font-size:clamp(42px,8vw,70px);animation:chase 2.7s ease-in-out infinite;filter:drop-shadow(0 5px 4px #0008)}@keyframes run{0%,100%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(42px,-7px) rotate(3deg)}}@keyframes chase{0%{left:-25%}100%{left:78%}}.caption{position:absolute;left:5%;top:8%;font-size:clamp(14px,3vw,24px);font-weight:800;text-shadow:0 2px 8px #000;animation:caption 5.4s steps(1) infinite}@keyframes caption{0%,49%{opacity:1}50%,100%{opacity:0}}.caption.two{animation:caption2 5.4s steps(1) infinite}@keyframes caption2{0%,49%{
