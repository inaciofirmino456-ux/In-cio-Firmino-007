name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy crypto-payment-instructions
        run: npx supabase functions deploy crypto-payment-instructions --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy verify-crypto-payment
        run: npx supabase functions deploy verify-crypto-payment --project-ref "$SUPABASE_PROJECT_REF"
