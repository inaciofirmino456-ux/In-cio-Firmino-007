name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy crypto-payment-instructions --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy verify-crypto-payment --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy create-order --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy order-status --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy payment-session --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy payment-webhook --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy click --project-ref "$SUPABASE_PROJECT_REF"
