name: Deploy Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy create-order --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy crypto-payment-instructions --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy order-status --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy click --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy verify-crypto-payment --project-ref "$SUPABASE_PROJECT_REF"
