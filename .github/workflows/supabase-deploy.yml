name: Deploy Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        if: ${{ startsWith(env.SUPABASE_ACCESS_TOKEN, 'sbp_') && env.SUPABASE_PROJECT_REF != '' }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        if: ${{ startsWith(env.SUPABASE_ACCESS_TOKEN, 'sbp_') && env.SUPABASE_PROJECT_REF != '' }}
        run: supabase db push

      - name: Deploy Edge Functions
        if: ${{ startsWith(env.SUPABASE_ACCESS_TOKEN, 'sbp_') && env.SUPABASE_PROJECT_REF != '' }}
        run: |
          supabase functions deploy create-order --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy crypto-payment-instructions --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy order-status --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy click --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy verify-crypto-payment --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy dodo-checkout --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy dodo-webhook --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy paypal-create-order --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy paypal-capture-order --project-ref "$SUPABASE_PROJECT_REF"

      - name: Explain skipped Supabase deployment
        if: ${{ !startsWith(env.SUPABASE_ACCESS_TOKEN, 'sbp_') || env.SUPABASE_PROJECT_REF == '' }}
        run: echo "Supabase functions are already deployed directly. Configure SUPABASE_ACCESS_TOKEN (sbp_...) and SUPABASE_PROJECT_REF in GitHub repository secrets to enable automatic deployments."
