name: Finish walletless crypto checkout
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove wallet checkout and add automatic detection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/App.tsx")
          s=p.read_text()
          s=s.replace('  verifyCryptoPayment,\n','  detectCryptoPayment,\n')
          s=s.replace('import { connectEvmWallet, readConnectedEvmWallet, shortAddress, sendNativePayment } from "./lib/wallet";\n','')
          for line in [
            '  const [walletAddress, setWalletAddress] = useState("");\n',
            '  const [walletChainId, setWalletChainId] = useState("");\n',
            '  const [walletConnecting, setWalletConnecting] = useState(false);\n',
          ]: s=s.replace(line,'')
          a=s.find('  async function handleConnectWallet() {')
          b=s.find('  async function prepareCrypto(network: string, asset: string) {')
          if a>=0 and b>=0: s=s[:a]+s[b:]
          a=s.find('  async function payWithWallet() {')
          b=s.find('  useEffect(() => {\n    if (!order || !paymentStatus.includes("aguard"))')
          if a>=0 and b>=0: s=s[:a]+s[b:]
          s=s.replace('getCryptoInstructions(order.id, network, asset, walletAddress || undefined)','getCryptoInstructions(order.id, network, asset)')
          old='''  useEffect(() => {
    if (!order || !paymentStatus.includes("aguard")) return;
    const timer = window.setInterval(async () => {
      try {
        const status = await getOrderStatus(order.id);
        if (status.status === "paid") { setPaymentStatus("Pagamento confirmado. O ranking foi atualizado."); await refresh(); window.clearInterval(timer); }
      } catch {}
    }, 4000);
    return () => window.clearInterval(timer);
  }, [order, paymentStatus]);'''
          new='''  useEffect(() => {
    if (!order || !crypto) return;
    let stopped = false;
    const detect = async () => {
      try {
        const result = await detectCryptoPayment(order.id, crypto.network, crypto.asset);
        if (stopped) return;
        if (result.status === "paid") {
          setPaymentStatus("Pagamento confirmado. O ranking foi atualizado.");
          await refresh();
        } else {
          setPaymentStatus("Aguardando pagamento... o TopBid verifica a blockchain automaticamente.");
        }
      } catch {
        if (!stopped) setPaymentStatus("Aguardando pagamento... o TopBid verifica a blockchain automaticamente.");
      }
    };
    void detect();
    const timer = window.setInterval(() => { void detect(); }, 5000);
    return () => { stopped = true; window.clearInterval(timer); };
  }, [order, crypto]);'''
          if old in s: s=s.replace(old,new)
          start=s.find('        <div className="mt-4 rounded-2xl border border-stone-200 bg-white p-4">')
          end=s.find('        <div className="mt-4">', start)
          if start>=0 and end>=0:
            block='''        <div className="mt-4 rounded-2xl border border-green-200 bg-green-50 p-4">
          <div className="flex items-start gap-3">
            <CheckCircle2 size={20} className="mt-0.5 shrink-0 text-green-600"/>
            <div>
              <div className="text-sm font-black text-green-800">Pagamento detetado automaticamente</div>
              <p className="mt-1 text-xs leading-5 text-green-700">Não precisa conectar carteira e não precisa enviar TX Hash. Envie exatamente o valor mostrado para o endereço indicado. O servidor verifica a blockchain e confirma o pedido automaticamente.</p>
            </div>
          </div>
        </div>
'''
            s=s[:start]+block+s[end:]
          s=s.replace('''          {["ethereum","bsc","robinhood_chain"].includes(crypto.network) && <button onClick={payWithWallet} disabled={!!paymentLoading} className="mt-3 inline-flex items-center gap-2 rounded-xl bg-stone-950 px-4 py-3 text-sm font-bold text-white disabled:opacity-50">{paymentLoading==="wallet"?"Aguardando carteira...":"💳 Pagar com carteira"}</button>}
          <p className="mt-2 text-xs text-stone-500">Não precisa copiar TX Hash. Depois da confirmação na carteira, o TopBid usa o TX Hash apenas internamente para verificar a transação e confirmar o pagamento.</p>''',
'''          <p className="mt-2 text-xs text-stone-500">Não precisa copiar TX Hash. O TopBid procura automaticamente a transferência recebida na blockchain e, quando estiver confirmada, atualiza o ranking.</p>''')
          p.write_text(s)

          p=Path("src/lib/api.ts")
          s=p.read_text()
          s=s.replace('''export async function getCryptoInstructions(orderId: string, network: string, asset: string, payerAddress?: string): Promise<CryptoInstructions> {
  return callFunction<CryptoInstructions>('crypto-payment-instructions', { orderId, network, asset, payerAddress });
}

export async function verifyCryptoPayment(orderId: string, network: string, asset: string, txHash: string) {
  const result = await callFunction<{ status?: string; result?: { status?: string }; message?: string }>('verify-crypto-payment', { orderId, network, asset, txHash });
  return { status: result.status ?? result.result?.status ?? "pending", message: result.message };
}
''','''export async function getCryptoInstructions(orderId: string, network: string, asset: string): Promise<CryptoInstructions> {
  return callFunction<CryptoInstructions>('crypto-payment-instructions', { orderId, network, asset });
}

export async function detectCryptoPayment(orderId: string, network: string, asset: string) {
  return callFunction<{ status: string; detected?: boolean; txHash?: string; confirmations?: number }>('detect-crypto-payment', { orderId, network, asset });
}
''')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "TopBid Bot"
          git config user.email "actions@github.com"
          git add src/App.tsx src/lib/api.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: remove wallet connection and detect crypto payments automatically"
          git push
